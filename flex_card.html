<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/flexcard.css">
    <title>상품카드 만들기</title>
</head>
<body>
    <div class="product-list">

        <!-- 첫 번째 상품 카드 -->
        <div class="product">
            <div class="image-box">
                <img src="img/headset.png" alt="무선 헤드폰">
            </div>

            <p class="product-name">무선 헤드폰</p>
            <div class="price">59,000원</div>
            <a href="#" class="buy-button">구매하기</a>

        </div>

        <!-- 두 번째 상품 카드 -->
        <div class="product">
            <div class="image-box">
                <img src="img/mouse.png" alt="무선 마우스">
            </div>

            <p class="product-name">무선 마우스</p>
            <div class="price">29,000원</div>
            <a href="#" class="buy-button">구매하기</a>
        </div>

    </div>
</body>
</html>
